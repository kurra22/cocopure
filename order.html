
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COCOPURE | Order</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f6ed;color:#174b35;font-family:Georgia,serif}
header{background:#082f20;color:white;text-align:center;padding:25px;font-family:Arial,sans-serif}
.logo{font-size:32px;letter-spacing:5px;font-weight:bold}
.logo span{color:#a8d69b}
main{max-width:620px;margin:25px auto;padding:20px}
h1{text-align:center;font-size:34px}
input[type=text],input[type=tel],textarea{width:100%;padding:17px;margin:10px 0;border:1px solid #cbd5ca;border-radius:9px;font-size:17px;font-family:Arial}
textarea{height:125px;resize:vertical}
.total{background:#e9f1e6;padding:35px 10px;text-align:center;border-radius:18px;margin:25px 0}
.total small{font-size:18px}
.total strong{display:block;font-size:48px;margin-top:15px}
h3{font-size:22px}
.payment{background:white;border:1px solid #d7dfd5;border-radius:12px;padding:20px;margin:15px 0}
.payment label{font-size:20px;font-weight:bold}
.payment p{color:#829086;margin-left:30px}
.payment input{width:auto;margin-right:10px}
.submit{width:100%;background:#174b35;color:white;border:0;padding:22px;border-radius:9px;font-size:20px;font-weight:bold;margin-top:20px}
.back{display:block;text-align:center;color:#174b35;font-size:19px;margin:30px}
footer{background:#082f20;color:white;text-align:center;padding:30px;font-size:19px}
</style>
</head>
<body>
<header><div class="logo">COCO<span>PURE</span></div></header>
<main>
<h1>Delivery Details</h1>
<form id="orderForm">
<input id="customerName" type="text" placeholder="Enter your full name" required maxlength="80">
<input id="mobile" type="tel" placeholder="Enter your 10-digit mobile number" required pattern="[6-9][0-9]{9}" maxlength="10">
<textarea id="address" placeholder="Enter your full delivery address in Karimnagar" required maxlength="500"></textarea>

<div class="total">
<small>YOUR TOTAL AMOUNT</small>
<strong id="total">₹0</strong>
</div>

<h3>Choose Payment Method</h3>
<div class="payment">
<label><input type="radio" name="payment" value="COD" checked> Cash on Delivery (COD)</label>
<p>Pay when your order arrives.</p>
</div>
<div class="payment">
<label><input type="radio" name="payment" value="ONLINE"> Online Payment</label>
<p>UPI, Debit Card, Credit Card and Net Banking.</p>
</div>
<button class="submit" type="submit">PLACE ORDER →</button>
</form>
<a class="back" href="products.html">← Go Back to Products</a>
</main>
<footer>COCOPURE<br>Pure Nature. Fresh Every Day.<br>Karimnagar, Telangana</footer>

<script>
/** @type {{name:string,price:number}[]} */
const productsData = [
{name:"Kobbari Bondam",price:35},
{name:"Kobbari Kaaya",price:40},
{name:"Kobbari Neellu",price:150}
];

/** @type {number[]} */
let quantities = [0,0,0];

try {
  const saved = JSON.parse(localStorage.getItem("cocopureCart") || "null");
  if(Array.isArray(saved) && saved.length === 3){
    quantities = saved.map((value,index) => {
      const number = Number(value);
      if(!Number.isInteger(number)) return 0;
      return Math.max(0,Math.min([20,20,10][index],number));
    });
  }
} catch(error) {
  quantities = [0,0,0];
}

const total = quantities.reduce((sum,q,index) => sum + q * productsData[index].price,0);
document.getElementById("total").textContent = "₹"+total;

document.getElementById("orderForm").addEventListener("submit",function(event){
  event.preventDefault();

  if(total <= 0){
    alert("Your order is empty. Please select products first.");
    return;
  }

  const payment = document.querySelector('input[name="payment"]:checked').value;

  if(payment === "ONLINE"){
    alert("Online payment is not connected yet. Please choose Cash on Delivery for now.");
    return;
  }

  const name = document.getElementById("customerName").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const address = document.getElementById("address").value.trim();

  if(!name || !mobile || !address) return;

  let message = "COCOPURE NEW ORDER\n";
  message += "Name: "+name+"\n";
  message += "Mobile: "+mobile+"\n";
  message += "Address: "+address+"\n\n";
  message += "Products:\n";

  quantities.forEach((quantity,index) => {
    if(quantity > 0){
      message += productsData[index].name+" x "+quantity+" = Rs."+quantity*productsData[index].price+"\n";
    }
  });

  message += "\nTotal: Rs."+total+"\nPayment: Cash on Delivery";

  /* Replace this example with your business WhatsApp number. */
  const businessNumber = "919063754015";

  if(businessNumber === "919063754015"){
    }

  const whatsappURL = "https://wa.me/"+businessNumber+"?text="+encodeURIComponent(message);
  window.open(whatsappURL,"_blank");

  /* This records a local order-request draft, not a confirmed order. */
  localStorage.setItem("cocopurePendingOrder",JSON.stringify({
    name:name,
    mobile:mobile,
    address:address,
    total:total,
    payment:"COD",
    status:"Awaiting WhatsApp confirmation"
  }));

  alert("WhatsApp opened. Send the order message there to complete your order request. Return here after sending it.");
});
</script>
</body>
</html>
